name: worker-secrets
# 手動実行だけ。GitHub の secrets（CC_REMOTE_MCP_*）の値を Worker のシークレットに書く。空の secret は書かない（消さない）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  set:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # 値は scripts/worker-secrets.ts が wrangler の stdin に渡す。ログには出さない
      - run: bun run worker-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CC_REMOTE_MCP_WORKER_NAME: ${{ vars.CC_REMOTE_MCP_WORKER_NAME }}
          CC_REMOTE_MCP_ALLOWED_EMAIL: ${{ secrets.CC_REMOTE_MCP_ALLOWED_EMAIL }}
          CC_REMOTE_MCP_DEVICE_KEYS: ${{ secrets.CC_REMOTE_MCP_DEVICE_KEYS }}
          CC_REMOTE_MCP_DISCORD_WEBHOOK_URL: ${{ secrets.CC_REMOTE_MCP_DISCORD_WEBHOOK_URL }}
