name: ci
on:
  pull_request:
  push:
    branches: [main]
  # シークレットを入れたあとなどに、main を手で再デプロイするため
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
  # main への push（と手動実行）で Worker をデプロイする
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # 本番のホスト名と Access の値は repository variables から差し込む（リポジトリの wrangler.jsonc は例の値）。
      # scripts/deploy.ts は1つでも空ならデプロイしない
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CC_REMOTE_MCP_MCP_HOST: ${{ vars.CC_REMOTE_MCP_MCP_HOST }}
          CC_REMOTE_MCP_LINK_HOST: ${{ vars.CC_REMOTE_MCP_LINK_HOST }}
          CC_REMOTE_MCP_ACCESS_TEAM_DOMAIN: ${{ vars.CC_REMOTE_MCP_ACCESS_TEAM_DOMAIN }}
          CC_REMOTE_MCP_ACCESS_AUD: ${{ vars.CC_REMOTE_MCP_ACCESS_AUD }}
          # 任意。空なら wrangler.jsonc の name（cc-remote-mcp）。旧名でデプロイ済みならその名前を入れる
          CC_REMOTE_MCP_WORKER_NAME: ${{ vars.CC_REMOTE_MCP_WORKER_NAME }}
      # デプロイ後の疎通確認：/mcp は Access が前にいるので 401 か 302、link. の /connect は WebSocket 以外を 426 で断る
      - name: smoke
        env:
          CC_REMOTE_MCP_MCP_HOST: ${{ vars.CC_REMOTE_MCP_MCP_HOST }}
          CC_REMOTE_MCP_LINK_HOST: ${{ vars.CC_REMOTE_MCP_LINK_HOST }}
        run: |
          sleep 10
          mcp=$(curl -s -o /dev/null -w '%{http_code}' "https://$CC_REMOTE_MCP_MCP_HOST/mcp")
          link=$(curl -s -o /dev/null -w '%{http_code}' "https://$CC_REMOTE_MCP_LINK_HOST/connect")
          echo "mcp=$mcp link=$link"
          case "$mcp" in 401|302) ;; *) echo "/mcp の応答が想定外"; exit 1 ;; esac
          [ "$link" = "426" ] || { echo "/connect の応答が想定外"; exit 1; }
