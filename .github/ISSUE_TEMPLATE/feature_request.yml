name: 機能の要望 / Feature request
description: 追加してほしい機能の提案 / Suggest a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること / Problem
      description: 何ができなくて困っているか / What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案 / Proposal
      description: こうなってほしい、という案 / What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代わりの方法 / Alternatives
      description: 検討した別の方法や、今のやり回し（任意） / Other options or workarounds you considered (optional)
